[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semanticfs"
version = "0.1.0"
description = "A temporal-associative semantic terminal file tool that replaces rigid folder hierarchies with context-aware, vector-based file retrieval."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "SemanticFS Contributors"},
]

dependencies = [
    "watchdog>=4.0",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "psutil>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
vision = [
    "transformers>=4.40",
    "torch>=2.0",
    "pillow>=10.0",
]
ocr = [
    "pytesseract>=0.3",
    "easyocr>=1.7",
    "pillow>=10.0",
]
onnx = [
    "optimum[onnxruntime]>=1.19",
    "transformers>=4.40",
]
train = [
    "datasets>=2.19",
    "accelerate>=0.30",
]
all = [
    "transformers>=4.40",
    "torch>=2.0",
    "pillow>=10.0",
    "pytesseract>=0.3",
    "easyocr>=1.7",
    "optimum[onnxruntime]>=1.19",
    "datasets>=2.19",
    "accelerate>=0.30",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
sfind = "semanticfs.cli:main"
semanticfs = "semanticfs.daemon:main"

[tool.setuptools.packages.find]
include = ["semanticfs*"]
