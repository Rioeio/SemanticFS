    <text x="40" y="425" fill="#f38ba8">def </text><tspan fill="#cba6f7">gaussian_elimination</tspan><tspan fill="#cdd6f4">(A: np.ndarray, b: np.ndarray) -&gt; np.ndarray:</tspan>
