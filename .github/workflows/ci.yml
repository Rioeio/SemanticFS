name: CI Build & Automated Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite & Benchmarks (${ { matrix.os } }, Python ${ { matrix.python-version } })
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    env:
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy sentence-transformers chromadb click rich pyyaml PyMuPDF python-docx python-pptx openpyxl psutil watchdog
          pip install -e .

      - name: Run Ruff Code Quality Lint
        run: |
          ruff check semanticfs/

      - name: Run Mypy Type Safety Gate (Windows)
        if: runner.os == 'Windows'
        run: |
          # Ensure Python uses UTF-8 and set console code page as a fallback
          $Env:PYTHONUTF8 = '1'
          $Env:PYTHONIOENCODING = 'utf-8'
          chcp.com 65001
          mypy --ignore-missing-imports --disable-error-code attr-defined --disable-error-code import-untyped semanticfs/
        shell: pwsh

      - name: Run Mypy Type Safety Gate (Unix)
        if: runner.os != 'Windows'
        run: |
          mypy --ignore-missing-imports --disable-error-code attr-defined --disable-error-code import-untyped semanticfs/

      - name: Run PyTest Automated Unit Tests
        run: |
          pytest tests/ -v

      - name: Run Portable Benchmark Suite
        run: |
          python benchmarks/run_benchmarks.py
