name: CI Build & Automated Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run pytest, ruff & Benchmarks on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff sentence-transformers chromadb click rich pyyaml PyMuPDF python-docx python-pptx openpyxl psutil watchdog
          pip install -e .

      - name: Run Ruff Lint Check
        run: |
          ruff check --exit-zero semanticfs/

      - name: Run PyTest Suite
        run: |
          pytest tests/test_ast_chunker.py tests/test_query_parser.py tests/test_store_scoring.py

      - name: Run Portable Benchmark Evaluation
        run: |
          python benchmarks/run_benchmarks.py
